{% comment %}
The header row of a panel of thread rows, naming the columns. Pass "name" for the first
column. Hidden from screen readers: each row says what its numbers are.
{% endcomment %}
<div class="panel__head thread-row" aria-hidden="true">
    <span>{{ name }}</span>
    <span>Replies</span>
    <span>Last reply</span>
</div>
