<!DOCTYPE html>
{% extends '_base.html' %}
{% load crispy_forms_tags %}

{% block title %}New thread{% endblock title %}

{% block content %}
    <div class="heading">
        <h2>New thread</h2>
    </div>
    {% include 'forums/_posting_as.html' %}
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-success" type="submit">Post</button>
        <a href="{% url 'forum_detail' forum.id %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
    {% include 'forums/_editor.html' %}
{% endblock content %}
