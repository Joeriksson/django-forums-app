{% load i18n %}
{# A third-party login (GitHub): a quiet button with the provider's mark #}
<a class="button button--quiet provider provider--{{ attrs.provider_id }}" href="{{ attrs.href }}">
    <span class="provider__mark" aria-hidden="true"></span>{% blocktranslate with name=attrs.name %}Continue with {{ name }}{% endblocktranslate %}
</a>
