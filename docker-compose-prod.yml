# Production stack for a VPS. A reverse proxy container (e.g. Caddy)
# terminates HTTPS, joins the forum_proxy network and forwards to forum-web:8000.
# No ports are published. POSTGRES_PASSWORD and REDIS_PASSWORD must be set in .env.

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: project.settings.production
  ENVIRONMENT: production
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/postgres
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0

services:
  web:
    build: .
    command: gunicorn project.wsgi -b 0.0.0.0:8000
    env_file:
      - .env
    environment: *app-environment
    networks:
      default:
      proxy:
        # Unique name for the proxy, which may be on other apps' networks too
        aliases:
          - forum-web
    depends_on:
      - db
      - redis
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: unless-stopped
  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    restart: unless-stopped
  celery:
    build: .
    command: celery -A project worker -l INFO
    env_file:
      - .env
    environment: *app-environment
    depends_on:
      - db
      - redis
    restart: unless-stopped
  celery-beat:
    build: .
    command: celery -A project beat -l INFO
    env_file:
      - .env
    environment: *app-environment
    depends_on:
      - redis
    restart: unless-stopped
networks:
  # Shared with the reverse proxy. Only web is on it, so the proxy can't reach db or redis.
  # Fixed name, so it doesn't depend on the directory the repo is cloned into.
  proxy:
    name: forum_proxy
volumes:
  postgres_data:
