# Production stack for a VPS. A reverse proxy container (e.g. Caddy)
# terminates HTTPS, joins the forum_proxy network and forwards to forum-web:8000.
# No ports are published. POSTGRES_PASSWORD and REDIS_PASSWORD must be set in .env.

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: project.settings.production
  ENVIRONMENT: production
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/postgres
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0

# Logs go to the host's journal instead of Docker's per-container files, which are
# deleted when a container is recreated (every update). Retention: journald.conf on the host.
x-logging: &journald
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  web:
    build: .
    # Address, workers and threads: gunicorn.conf.py
    command: gunicorn project.wsgi
    env_file:
      - .env
    environment: *app-environment
    networks:
      default:
      proxy:
        # Unique name for the proxy, which may be on other apps' networks too
        aliases:
          - forum-web
    depends_on:
      - db
      - redis
    logging: *journald
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    logging: *journald
    restart: unless-stopped
  redis:
    image: redis:alpine
    # The password goes into a config file inside the container, not onto the command
    # line, where `ps` on the host would show it. Without the image's entrypoint nothing
    # switches to the redis user, hence `user`.
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    logging: *journald
    restart: unless-stopped
  celery:
    build: .
    command: celery -A project worker -l INFO
    env_file:
      - .env
    environment: *app-environment
    depends_on:
      - db
      - redis
    logging: *journald
    restart: unless-stopped
networks:
  # Shared with the reverse proxy. Only web is on it, so the proxy can't reach db or redis.
  # Fixed name, so it doesn't depend on the directory the repo is cloned into.
  proxy:
    name: forum_proxy
volumes:
  postgres_data:
