name: Django CI

# Changes to documentation alone don't start the workflow: no job reads those files.
# A change that touches any other file as well runs everything.
on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

env:
  ENVIRONMENT: CI
  SECRET_KEY: 1234
  REDIS_URL: redis://localhost:6379/0

jobs:

  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8.10-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      with:
        python-version: "3.12"
    - name: Install Dependencies
      run: uv sync
    - name: Run Tests
      run: uv run pytest -v --disable-warnings

  audit:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      with:
        python-version: "3.12"
    - name: Check dependencies for known vulnerabilities
      run: make audit

  prod-image:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Build the production image
      run: docker build -t forums-prod .
    # Postgres set up as in production: docker-compose-prod.yml mounts the same script
    - name: Start Postgres with the production init script
      run: |
        docker network create prod
        docker run -d --name db --network prod \
          -e POSTGRES_PASSWORD=ci-superuser -e POSTGRES_APP_PASSWORD=ci-app \
          -v "$PWD/docker/postgres:/docker-entrypoint-initdb.d:ro" postgres:16.15
    # Fake values only: the checks need no Redis or real secrets
    - name: Start the image with production settings
      run: >-
        docker run -d --name prod --network prod
        -e DJANGO_SETTINGS_MODULE=project.settings.production
        -e ENVIRONMENT=production
        -e SECRET_KEY=ci-only-placeholder-secret-key-not-used-anywhere-else-0123456789
        -e DJANGO_MFA_ENCRYPTION_KEY=Y2ktb25seS1wbGFjZWhvbGRlci1tZmEta2V5LTAwMDE=
        -e DJANGO_ADMINS=admin@example.com
        -e DJANGO_ALLOWED_HOSTS=forum.example.com
        -e DJANGO_SITE_URL=https://forum.example.com
        -e DJANGO_EMAIL_CONSOLE=true
        -e DATABASE_URL=postgres://forum:ci-app@db:5432/forum
        -e REDIS_URL=redis://redis:6379/0
        forums-prod
    - name: Run the deployment checks
      run: docker exec prod python manage.py check --deploy --fail-level WARNING
    # The image's own command only keeps this container alive: gunicorn starts in the compose step below
    - name: Check that gunicorn can load its settings and the app
      run: docker exec prod gunicorn --check-config project.wsgi
    - name: Check that the container does not run as root
      run: test "$(docker exec prod id -u)" != 0
    # A migration that needs more than the app's role (an extension, say) fails here
    - name: Check that the migrations run as the app's database role
      run: |
        # Over TCP: while the init script runs, Postgres only listens on its socket
        for i in $(seq 30); do
          docker exec db pg_isready -q -h 127.0.0.1 && break
          sleep 1
        done
        docker exec prod python manage.py migrate --no-input
    - name: Check that the app's database role has no special rights
      run: >-
        test "$(docker exec db psql -U postgres -tAc
        "select rolsuper or rolcreatedb or rolcreaterole from pg_roles where rolname = 'forum'")" = f
    - name: Check that the API is off unless switched on
      run: >-
        docker exec prod python manage.py shell -c
        "from django.urls import get_resolver;
        routes = [str(p.pattern) for p in get_resolver().url_patterns];
        assert routes and 'api/' not in routes, routes"
    - name: Check that development packages are not in the image
      run: >-
        docker exec prod python -c
        "import importlib.util as u;
        found = [m for m in ('debug_toolbar', 'pytest') if u.find_spec(m)];
        assert not found, found"
    - name: Check that static file URLs are hashed
      run: >-
        docker exec prod python manage.py shell -c
        "import re; from django.templatetags.static import static;
        url = static('css/base.css'); print(url);
        assert re.fullmatch(r'/static/css/base\.[0-9a-f]{12}\.css', url)"
    # The steps above start the image by hand. This one starts the whole stack the way the
    # server does: web's command (migrate, then gunicorn), the wait for a healthy db, Redis
    # with its password file and the Celery worker. Fake values only.
    - name: Start the production compose stack
      run: |
        cat > .env <<'ENV'
        SECRET_KEY=ci-only-placeholder-secret-key-not-used-anywhere-else-0123456789
        DJANGO_MFA_ENCRYPTION_KEY=Y2ktb25seS1wbGFjZWhvbGRlci1tZmEta2V5LTAwMDE=
        DJANGO_ALLOWED_HOSTS=localhost
        DJANGO_SITE_URL=https://localhost
        DJANGO_EMAIL_CONSOLE=true
        POSTGRES_PASSWORD=ci-superuser
        POSTGRES_APP_PASSWORD=ci-app
        REDIS_PASSWORD=ci-redis
        ENV
        docker compose -f docker-compose-prod.yml up -d --build --wait
    # A page needs the migrated database, so a 200 means the migrations ran and gunicorn serves.
    # The headers are the ones the reverse proxy would add
    - name: Check that the stack serves the home page
      run: |
        fetch="import urllib.request as u; r = u.urlopen(u.Request('http://localhost:8000/', headers={'Host': 'localhost', 'X-Forwarded-Proto': 'https'})); print(r.status)"
        for i in $(seq 30); do
          docker compose -f docker-compose-prod.yml exec -T web python -c "$fetch" 2>/dev/null && exit 0
          sleep 2
        done
        exit 1
    - name: Check that the Celery worker reached Redis
      run: docker compose -f docker-compose-prod.yml exec -T celery celery -A project inspect ping --timeout 10
    - name: Show the stack's logs if it failed
      if: failure()
      run: |
        docker compose -f docker-compose-prod.yml ps -a
        docker compose -f docker-compose-prod.yml logs
