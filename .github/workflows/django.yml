name: Django CI

# Changes to documentation alone don't start the workflow: no job reads those files.
# A change that touches any other file as well runs everything.
on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

env:
  ENVIRONMENT: CI
  SECRET_KEY: 1234
  REDIS_URL: redis://localhost:6379/0

jobs:

  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
    - name: Install Dependencies
      run: uv sync
    - name: Run Tests
      run: uv run pytest -v --disable-warnings

  audit:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
    - name: Check dependencies for known vulnerabilities
      run: make audit

  prod-image:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the production image
      run: docker build -t forums-prod .
    # Fake values only: the checks need no database, Redis or real secrets
    - name: Start the image with production settings
      run: >-
        docker run -d --name prod
        -e DJANGO_SETTINGS_MODULE=project.settings.production
        -e ENVIRONMENT=production
        -e SECRET_KEY=ci-only-placeholder-secret-key-not-used-anywhere-else-0123456789
        -e DJANGO_ADMINS=admin@example.com
        -e DJANGO_ALLOWED_HOSTS=forum.example.com
        -e DJANGO_SITE_URL=https://forum.example.com
        -e DJANGO_EMAIL_CONSOLE=true
        -e DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
        -e REDIS_URL=redis://redis:6379/0
        forums-prod
    - name: Run the deployment checks
      run: docker exec prod python manage.py check --deploy --fail-level WARNING
    # The image's own command only keeps the container alive, so nothing else starts gunicorn
    - name: Check that gunicorn can load its settings and the app
      run: docker exec prod gunicorn --check-config project.wsgi
    - name: Check that development packages are not in the image
      run: >-
        docker exec prod python -c
        "import importlib.util as u;
        found = [m for m in ('debug_toolbar', 'pytest') if u.find_spec(m)];
        assert not found, found"
    - name: Check that static file URLs are hashed
      run: >-
        docker exec prod python manage.py shell -c
        "import re; from django.templatetags.static import static;
        url = static('css/base.css'); print(url);
        assert re.fullmatch(r'/static/css/base\.[0-9a-f]{12}\.css', url)"
