[project]
name = "django-forums-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.5",
    "crispy-bootstrap4>=2022.1",
    "dj-database-url>=2.1,<3",
    "django>=5.2,<6.0",
    "django-allauth[mfa]>=65.14.1",
    "django-cors-headers>=4.0",
    "django-crispy-forms>=2.1",
    "django-debug-toolbar>=4.2",
    "django-lifecycle>=1.0",
    "django-redis>=5.4",
    "djangorestframework>=3.14",
    "gunicorn>=23",
    "inflection>=0.5",
    "martor>=1.8",
    "psycopg2-binary>=2.9.10",
    "pyjwt[crypto]>=2.8",
    "pyyaml>=6.0",
    "redis>=4.6",
    "requests>=2.31",
    "uritemplate>=4.1",
    "whitenoise>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
    "pytest-xdist>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".*", "venv", ".venv"]
# --ds wins over a DJANGO_SETTINGS_MODULE env var (e.g. from .env); the ini key doesn't
addopts = "-n auto --ds=project.settings.test"
# Fail on anything Django 6 removes, so the upgrade has no surprises
filterwarnings = ["error::django.utils.deprecation.RemovedInDjango60Warning"]

[tool.coverage.run]
omit = [
    "*apps.py",
    "project/settings/*",
    "*urls.py",
    "*wsgi.py",
    "*asgi.py",
    "manage.py",
    "*migrations/*",
    "*tests/*",
]
branch = true
